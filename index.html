<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Explorer - Play Online</title>
    <!-- PyScript CSS & JS (Latest Version) -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #f0883e;
            margin-bottom: 5px;
        }
        p {
            color: #8b949e;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .terminal-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <h1>Dungeon Explorer</h1>
    <p>A Python CLI game running in Web Worker thread</p>
    
    <div class="terminal-container">
        <!-- The worker and terminal attributes allow input() and time.sleep() to work smoothly -->
        <script type="py" src="./main.py" worker terminal></script>
    </div>
</body>
</html>
